name: Orchestrator
run-name: ${{ format('Orchestrator ({0})', github.event_name) }}
      
on:
  schedule:
    - cron: "5,20,35,50 * * * *"
  workflow_dispatch:
    inputs:
      provision_mode:
        description: 'Provision mode (if set to initial it will use ubuntu-latest image)'
        type: choice
        options:
          - initial
          - regular
        required: true
        default: 'regular'
      loop:
        description: 'Loop the action'
        type: choice
        options:
          - "yes"
          - "no"
        required: false
        default: "no"
      run_light:
        description: 'Run light VMs'
        type: choice
        options:
          - "yes"
          - "no"
        required: false
        default: "yes"
      run_heavy:
        description: 'Run heavy VMs'
        type: choice
        options:
          - "yes"
          - "no"
        required: false
        default: "yes"
jobs:
  light:
    name: Populate light VMs
    if: ${{ inputs.run_light == 'yes' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/scheduler.yaml
    secrets: inherit
    with:
      max_vms_to_create: 5
      vms_ttl: "86400"
      flavor: light
      provision_mode: ${{ inputs.provision_mode || 'regular' }}
      loop: ${{ inputs.provision_mode == 'initial' && 'no' || (inputs.loop || 'no') }}

  heavy:
    name: Populate heavy VMs
    if: ${{ inputs.run_heavy == 'yes' || github.event_name == 'schedule' }}
    uses: ./.github/workflows/scheduler.yaml
    secrets: inherit
    with:
      max_vms_to_create: 1
      vms_ttl: "86400"
      flavor: heavy
      provision_mode: ${{ inputs.provision_mode || 'regular' }}
      loop: ${{ inputs.provision_mode == 'initial' && 'no' || (inputs.loop == 'yes' && 'yes' || 'no') }}
  
  restart:
    name: Run gh cli to start this workflow with the same arguments if it is not cancelled and looped
    if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' && inputs.loop == 'yes' }}
    runs-on: ${{ inputs.provision_mode == 'initial' && fromJson('["ubuntu-latest"]') || fromJson('["self-hosted", "runner_light"]') }}
    needs: 
      - light
      - heavy
    steps:
      - name: Set up gh cli
        uses: ./.github/actions/gh_cli
      - name: Run gh cli to start this workflow with the same arguments
        shell: bash --noprofile --norc -eo pipefail -x {0} 
        run: |
          gh workflow run orchestrator.yaml -R "${GITHUB_REPO}" --field provision_mode="${{ inputs.provision_mode }}" --field loop="${{ inputs.loop }}" --field run_light="${{ inputs.run_light }}" --field run_heavy="${{ inputs.run_heavy }}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_PERSONAL_ACCESS_TOKEN }}
          GITHUB_REPO: ${{ github.repository }}
